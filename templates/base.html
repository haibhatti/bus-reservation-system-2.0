<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Reservation System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .container { max-width: 1000px; }
        .seat { width: 50px; height: 50px; margin: 5px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .seat-available { background: #28a745; color: white; }
        .seat-booked { background: #dc3545; color: white; cursor: not-allowed; }
        .seat-selected { background: #ffc107; color: black; }
        .navbar { margin-bottom: 20px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <!-- BACKEND: {% url 'home' %} calls the home view in views.py -->
            <a class="navbar-brand" href="{% url 'home' %}">Bus Reservation System</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'search_route' %}">Book a Ticket</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'track_booking' %}">Track Booking</a></li>
                    
                    <!-- BACKEND: Django's built-in user authentication check. Evaluates True if a staff member is logged in -->
                    {% if user.is_authenticated %}
                        <li class="nav-item"><a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'logout' %}">Logout</a></li>
                    {% else %}
                        <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Employee Login</a></li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>
    <div class="container">
        <!-- BACKEND: Django Message Framework. Displays temporary pop-ups generated by messages.success() or messages.error() in views.py -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        
        <!-- BACKEND: Child templates (like home.html or book_step_1.html) inject their code inside this block -->
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
