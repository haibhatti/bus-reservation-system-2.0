{% extends 'base.html' %}
{% block content %}
<h2>Edit Ticket: {{ ticket.pnr_number }}</h2>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{% url 'view_bookings' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
